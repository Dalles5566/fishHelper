name: Deploy

# push 到 main 自动:构建镜像 → 推 GHCR → 服务器拉镜像重启
on:
  push:
    branches: [main]
    paths-ignore: # 只改文档不触发部署
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dalles5566/fishhelper # GHCR 镜像名(必须全小写)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 允许推 GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 1. 构建镜像并推到 GHCR ----
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # ---- 2. 部署到服务器(只拉镜像,不在服务器构建)----
      - name: 配置 SSH(CI → 服务器)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: 同步 docker-compose.yml 到服务器
        run: |
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/fishHelper/docker-compose.yml"

      - name: 服务器登录 GHCR + 拉镜像 + 重启
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /root/fishHelper && \
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             docker compose pull && docker compose up -d && docker image prune -f"

      - name: 部署后健康检查(确认跑的是本次 commit)
        run: |
          sleep 8
          echo "本次部署 commit: ${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /root/fishHelper && docker compose ps && docker compose logs app --tail 15 | grep -E "commit=|上线|Authenticated"'
